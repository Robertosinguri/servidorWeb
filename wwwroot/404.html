<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - No Encontrado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #eee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            text-align: center;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 120px;
            color: #e94560;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 40px rgba(233,69,96,0.3);
        }
        h2 {
            font-size: 1.8em;
            color: #ccc;
            margin: 10px 0 20px;
        }
        p {
            color: #888;
            margin-bottom: 30px;
            font-size: 1.1em;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,210,255,0.3);
        }
        .error-code {
            font-family: 'Consolas', monospace;
            color: #e94560;
            font-size: 0.9em;
            margin-top: 20px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>🔍 Archivo No Encontrado</h2>
        <p>El recurso que estás buscando no existe en este servidor.<br>
        Puede que haya sido movido, eliminado o que la URL sea incorrecta.</p>
        <a href="/" class="btn">← Volver al inicio</a>
        <div class="error-code">ServidorWeb C# • HTTP/1.1 • 404 Not Found</div>
    </div>
</body>
</html>
